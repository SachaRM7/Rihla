name: Quality checks
on:
  push:
    branches: [main, 'quality/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Regression tests
        run: |
          if [ -f scripts/test-regressions.mjs ]; then
            node scripts/test-regressions.mjs
          fi
      - name: Build Cloudflare Worker
        run: npx vinext build
