name: Verify reviewed recovery
on:
  push:
    branches: [quality/verified-playback-20260920]
    paths: ['.quality/**', '.github/workflows/apply-reviewed.yml', 'scripts/test-browser.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-recovery
  cancel-in-progress: true
jobs:
  recovery:
    if: github.ref == 'refs/heads/quality/verified-playback-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final reviewed lifecycle guard
        run: python .quality/finalize.py
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Regression tests
        run: node scripts/test-regressions.mjs
      - name: Browser integration tests
        run: node scripts/test-browser.mjs
      - name: Build Cloudflare Worker
        run: npx vinext build
      - name: Commit only verified source to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components hooks lib scripts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: verify playlist lifecycle in browser before production'
            git push origin HEAD:quality/verified-playback-20260920
          fi
