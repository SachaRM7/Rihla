name: Verify reviewed recovery
on:
  push:
    branches: [quality/verified-playback-20260920]
    paths: ['.quality/**', '.github/workflows/apply-reviewed.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-recovery
  cancel-in-progress: true
jobs:
  recovery:
    if: github.ref == 'refs/heads/quality/verified-playback-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source edits
        run: |
          python .quality/repair-source.py
          python .quality/repair-playback.py
          if [ -f .quality/followup.py ]; then python .quality/followup.py; fi
          git diff --check
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Regression tests
        run: node scripts/test-regressions.mjs
      - name: Build Cloudflare Worker
        run: npx vinext build
      - name: Commit only verified source to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components hooks lib scripts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: verify mixed playlist playback end to end'
            git push origin HEAD:quality/verified-playback-20260920
          fi
